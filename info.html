<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Demo</title>
    <style>
        h1 {
            color: blue;
            font-size: 50px;
            text-align: center;
            text-transform: uppercase;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-decoration: underline;
            text-shadow: 2px 2px 4px #000000;
            background-color: lightgray;
            padding: 20px;
            margin: 20px;
            border: 2px solid black;
            border-radius: 10px;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;

        }

        p{
            font-size: 45px;
            text-align: center;
            text-transform: capitalize;
            font-family: 'Courier New', Courier, monospace;
            font-weight: normal;
            text-decoration: none;
            text-shadow: none;
            background-color: white;
            padding: 10px;
            margin: 10px;
            border: 1px solid gray;
            border-radius: 5px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            
        }
    </style>
</head>
<body>
    <h1>This is a heading</h1>
    <h1>This is a second heading</h1>
    <p>Lorem ipsum dolor sit amet consectetur 
        adipisicing elit. Quis nihil aspernatur sequi deleniti 
        perspiciatis alias tempora, adipisci, perferendis 
        mollitia amet ipsum magni reprehenderit laboriosam odit 
        nemo ipsam voluptate rerum dolores.</p>
</body>
</html>
